site_name: TWIST2 Documentation

# You can switch this to your internal/company fork if needed
repo_url: https://github.com/YanjieZe/TWIST2

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.sections
    - navigation.footer
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md

  - Getting started:
      - Installation: GettingStarted/Installation.md
      - Environments (`twist2` & `gmr`): GettingStarted/Environments.md

  - TWIST2 Concepts:
      - System Overview: Concepts/SystemOverview.md
      - Neck Module: Concepts/NeckModule.md

  - User Guide:
      - Training & Deployment Overview: UserGuide/TrainingAndDeployment.md
      - Teleop Pipeline: UserGuide/TeleopPipeline.md
      - Sim2Sim Verification: UserGuide/Sim2Sim.md
      - Sim2Real with Unitree (EN): UserGuide/Sim2Real_Unitree_en.md
      # - Sim2Real with Unitree (ZH): UserGuide/Sim2Real_Unitree_zh.md
      - GUI Usage: UserGuide/GUI.md

  # - Developer Guide:
  #     - Project Structure: DeveloperGuide/ProjectStructure.md
  #     - Configuration & Scripts: DeveloperGuide/Configuration.md
  #     - How to Contribute: DeveloperGuide/HowToContribute.md
  #     - Troubleshooting: DeveloperGuide/Troubleshooting.md

  # - Reference:
  #     - Citations & Contact: Reference/Citations.md
  #     - Acknowledgments: Reference/Acknowledgments.md
  #     - Changelog: Reference/Changelog.md
